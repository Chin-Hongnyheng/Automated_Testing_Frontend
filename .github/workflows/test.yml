name: Frontend Tests
on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend code
        uses: actions/checkout@v4

      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: Chin-Hongnyheng/Automated_Exam
          path: backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Start backend
        working-directory: backend
        env:
          JWT_ACCESS_SECRET: ci-access-secret-key
          JWT_REFRESH_SECRET: ci-refresh-secret-key
          JWT_ACCESS_EXPIRES: 15m
          JWT_REFRESH_EXPIRES: 7d
          PORT: 3000
        run: npm run start:prod &

      - name: Wait for backend to be ready
        run: npx wait-on http://localhost:3000/graphql --timeout 60000

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: e2e/screenshots/

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Get committer email
        if: always()
        id: committer
        run: echo "email=$(git log -1 --pretty=format:'%ae')" >> $GITHUB_OUTPUT

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 'Frontend Test Result - ${{ job.status }} - ${{ github.repository }}'
          to: ${{ steps.committer.outputs.email }},srengty@gmail.com
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Committer: ${{ github.actor }}
            Status: ${{ job.status }}
            Check details at:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
